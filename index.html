<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="description"
        content="Travel Log - Pencatatan lokasi perjalanan"
    >

    <title>Travel Log</title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="container">


        <section class="card">


            <!-- =================================
                 HEADER
                 ================================= -->

            <div class="header">

                <h1>
                    Travel Log
                </h1>

                <p class="subtitle">
                    Pencatatan lokasi perjalanan
                </p>

            </div>


            <!-- =================================
                 BUTTON
                 ================================= -->

            <button
                id="btnAmbilLokasi"
                type="button"
            >
                AMBIL LOKASI
            </button>


            <!-- =================================
                 STATUS
                 ================================= -->

            <div
                id="status"
                class="status status-idle"
            >
                Siap mengambil lokasi.
            </div>


            <!-- =================================
                 DATA GPS
                 ================================= -->

            <div class="data">


                <!-- LATITUDE -->

                <div class="field">

                    <label for="latitude">
                        Latitude
                    </label>

                    <input
                        type="text"
                        id="latitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- LONGITUDE -->

                <div class="field">

                    <label for="longitude">
                        Longitude
                    </label>

                    <input
                        type="text"
                        id="longitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- ACCURACY -->

                <div class="field">

                    <label for="accuracy">
                        Accuracy
                    </label>

                    <input
                        type="text"
                        id="accuracy"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- WAKTU -->

                <div class="field">

                    <label for="waktu">
                        Waktu
                    </label>

                    <input
                        type="text"
                        id="waktu"
                        readonly
                        placeholder="-"
                    >

                </div>


            </div>


            <!-- =================================
                 INFORMASI
                 ================================= -->

            <div class="info">

                <p>
                    Tekan tombol
                    <strong>AMBIL LOKASI</strong>
                    untuk mendapatkan lokasi GPS.
                </p>

                <p>
                    Data akan otomatis disimpan
                    ke Google Spreadsheet.
                </p>

            </div>


        </section>


    </main>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="script.js"></script>


</body>

</html>
