<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Personal Travel Log"
    >

    <title>Personal Travel Log</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <header class="header">
                <h1>Personal Travel Log</h1>
                <p>Catat lokasi perjalanan secara otomatis</p>
            </header>


            <!-- STATUS -->
            <div
                id="status"
                class="status hidden">
            </div>


            <!-- INFORMASI USER -->
            <section class="section">

                <h2>Informasi Pengguna</h2>

                <div class="field">

                    <label for="userGmail">
                        Gmail
                    </label>

                    <input
                        id="userGmail"
                        type="email"
                        placeholder="Akun Google"
                        readonly
                    >

                </div>

            </section>


            <!-- LOKASI -->
            <section class="section">

                <h2>Lokasi</h2>

                <div class="grid">

                    <div class="field">

                        <label for="latitude">
                            Latitude
                        </label>

                        <input
                            id="latitude"
                            type="text"
                            placeholder="-"
                            readonly
                        >

                    </div>


                    <div class="field">

                        <label for="longitude">
                            Longitude
                        </label>

                        <input
                            id="longitude"
                            type="text"
                            placeholder="-"
                            readonly
                        >

                    </div>


                    <div class="field">

                        <label for="accuracy">
                            Accuracy
                        </label>

                        <input
                            id="accuracy"
                            type="text"
                            placeholder="-"
                            readonly
                        >

                    </div>

                </div>


                <button
                    id="locationButton"
                    class="btn primary"
                    type="button">

                    AMBIL LOKASI

                </button>

            </section>


            <!-- WAKTU -->
            <section class="section">

                <h2>Waktu</h2>

                <div class="field">

                    <label for="timestamp">
                        Timestamp
                    </label>

                    <input
                        id="timestamp"
                        type="text"
                        placeholder="-"
                        readonly
                    >

                </div>

            </section>


            <!-- SIMPAN -->
            <section class="section">

                <button
                    id="saveButton"
                    class="btn success"
                    type="button"
                    disabled>

                    SIMPAN LOG

                </button>

            </section>


            <footer>
                Personal Travel Log
            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
