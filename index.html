<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="description"
        content="Travel Log - Pencatatan lokasi perjalanan"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Travel Log"
    >

    <title>Travel Log</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <main class="container">

        <section class="card">


            <!-- HEADER -->

            <div class="header">

                <h1>
                    Travel Log
                </h1>

                <p class="subtitle">
                    Pencatatan lokasi perjalanan
                </p>

            </div>


            <!-- BUTTON -->

            <button
                id="btnAmbilLokasi"
                type="button"
            >
                AMBIL LOKASI
            </button>


            <!-- STATUS -->

            <div
                id="status"
                class="status status-idle"
            >
                Siap mengambil lokasi.
            </div>


            <!-- DATA -->

            <div class="data">


                <!-- LATITUDE -->

                <div class="field">

                    <label for="latitude">
                        Latitude
                    </label>

                    <input
                        type="text"
                        id="latitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- LONGITUDE -->

                <div class="field">

                    <label for="longitude">
                        Longitude
                    </label>

                    <input
                        type="text"
                        id="longitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- ACCURACY -->

                <div class="field">

                    <label for="accuracy">
                        Accuracy
                    </label>

                    <input
                        type="text"
                        id="accuracy"
                        readonly
                        placeholder="-"
                    >

                </div>


                <!-- WAKTU -->

                <div class="field">

                    <label for="waktu">
                        Waktu
                    </label>

                    <input
                        type="text"
                        id="waktu"
                        readonly
                        placeholder="-"
                    >

                </div>


            </div>


            <!-- INFO -->

            <div class="info">

                <p>
                    Tekan tombol
                    <strong>AMBIL LOKASI</strong>
                    untuk mendapatkan koordinat GPS.
                </p>

                <p>
                    Data yang dikirim ke Google Spreadsheet:
                </p>

                <ul>

                    <li>Timestamp</li>

                    <li>Latitude</li>

                    <li>Longitude</li>

                    <li>Accuracy</li>

                    <li>Waktu</li>

                </ul>

            </div>


        </section>

    </main>


    <!--
        HIDDEN IFRAME

        Digunakan untuk mengirim
        request GET ke Google Apps Script
        tanpa meninggalkan halaman.
    -->

    <iframe
        name="googleScriptFrame"
        id="googleScriptFrame"
        style="display:none;"
        title="Google Apps Script">
    </iframe>


    <!-- JAVASCRIPT -->

    <script
        src="script.js">
    </script>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(
                            function (registration) {

                                console.log(
                                    "Service Worker aktif:",
                                    registration.scope
                                );

                            }
                        )
                        .catch(
                            function (error) {

                                console.error(
                                    "Service Worker error:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>

</html>
