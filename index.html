<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="description"
        content="Travel Log Location Tracker"
    >

    <title>Travel Log</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Travel Log</h1>

            <p class="subtitle">
                Catat lokasi perjalanan Anda
            </p>


            <button
                id="btnAmbilLokasi"
                type="button"
            >
                AMBIL LOKASI
            </button>


            <div
                id="status"
                class="status status-idle"
            >
                Siap mengambil lokasi.
            </div>


            <div class="data">

                <div class="field">

                    <label>
                        Latitude
                    </label>

                    <input
                        type="text"
                        id="latitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <div class="field">

                    <label>
                        Longitude
                    </label>

                    <input
                        type="text"
                        id="longitude"
                        readonly
                        placeholder="-"
                    >

                </div>


                <div class="field">

                    <label>
                        Accuracy
                    </label>

                    <input
                        type="text"
                        id="accuracy"
                        readonly
                        placeholder="-"
                    >

                </div>


                <div class="field">

                    <label>
                        Waktu
                    </label>

                    <input
                        type="text"
                        id="waktu"
                        readonly
                        placeholder="-"
                    >

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
